{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom: 20px;">Редактирование: {{ product.title }}</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button type="submit" style="flex: 1; padding: 12px; background: #f39c12; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
                Сохранить изменения
            </button>
            <a href="{% url 'profile' %}" style="padding: 12px 20px; background: #95a5a6; color: white; text-decoration: none; border-radius: 8px; text-align: center;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
